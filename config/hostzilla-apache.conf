# Hostzilla — Apache reverse-proxy vhost for the control panel itself.
# Installed to /etc/apache2/sites-available/hostzilla.conf, enabled with a2ensite.
#
# This fronts the gunicorn app listening on 127.0.0.1:2087 (PANEL_PORT). It is the
# DEFAULT host for the server so the panel answers on the raw IP and on PANEL_DOMAIN.
#
# Requires: a2enmod proxy proxy_http rewrite ssl headers setenvif  (the installer does this).
#
# ── Enabling HTTPS for the panel ──────────────────────────────────────────────
# Once PANEL_DOMAIN is set in /etc/hostzilla/hostzilla.conf and its DNS A record
# points at this server, issue a certificate (certbot edits/clones this vhost):
#
#     certbot --apache -d "$PANEL_DOMAIN" --agree-tos -m "$ADMIN_EMAIL" --redirect
#
# certbot writes a parallel hostzilla-le-ssl.conf on :443 and adds the redirect.
# ──────────────────────────────────────────────────────────────────────────────

<VirtualHost *:80>
    # Default vhost: serves the panel on the bare IP. Set ServerName once you
    # have a hostname so name-based routing + certbot work cleanly.
    # ServerName panel.example.com

    ProxyPreserveHost On
    ProxyRequests Off

    # Tell the app it sits behind a proxy and whether the edge was HTTPS, so the
    # Flask ProxyFix middleware can build correct absolute URLs / secure cookies.
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    # Don't proxy the ACME http-01 challenge — let Apache serve it from disk so
    # certbot can validate PANEL_DOMAIN without round-tripping through gunicorn.
    ProxyPass /.well-known/acme-challenge/ !

    ProxyPass        / http://127.0.0.1:2087/ retry=0
    ProxyPassReverse / http://127.0.0.1:2087/

    ErrorLog  ${APACHE_LOG_DIR}/hostzilla-error.log
    CustomLog ${APACHE_LOG_DIR}/hostzilla-access.log combined
</VirtualHost>
