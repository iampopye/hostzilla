name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# No token permissions by default. Each job grants only what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-python:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff==0.6.9"
      - name: ruff check
        run: ruff check --output-format=github .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is what Ubuntu 22.04 ships; 3.12 is what 24.04 ships. Both are
        # supported install targets, so both must stay green.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r panel/requirements.txt
          pip install pytest
      - name: Run tests
        run: pytest -v

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Show shellcheck version
        run: shellcheck --version
      - name: Check syntax of every shell script
        run: |
          for script in runner/*.sh install.sh; do
            bash -n "$script"
          done
      - name: ShellCheck runner and installer
        # -x follows `source` directives so _lib.sh is analysed in context.
        run: shellcheck -x -S warning runner/*.sh install.sh

  landing-page:
    name: Landing page
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: docs/index.html is up to date with its source and the panel CSS
        run: python tools/build_landing_page.py --check
      - name: Assert zero external subresources
        run: python tests/check_landing_page.py

  sudoers:
    name: Validate sudoers allowlist
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: visudo syntax check
        # The installer refuses to place a file that fails this; catch it in CI
        # rather than on an operator's server.
        run: visudo -cf config/sudoers.hostzilla
